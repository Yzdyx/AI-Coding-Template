name: Bug report
description: Report a reproducible defect in the template or its checks.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove secrets, credentials, private URLs, and customer data before submitting. Security vulnerabilities must follow SECURITY.md instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and the indexed documentation.
          required: true
        - label: This report does not contain a security vulnerability or secret.
          required: true

  - type: input
    id: commit
    attributes:
      label: Tested commit or version
      placeholder: Commit SHA, tag, or branch
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Coding-agent instructions or documentation
        - GitHub Actions, issue forms, or repository governance
        - Research agent
        - Support agent
        - Application or shared package
        - Schema or public contract
        - Evaluation
        - Infrastructure or local tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the defect and its user or engineering impact in one paragraph.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and command output
      description: Paste the relevant command and its real output. Redact sensitive values.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python:
        Node.js:
        pnpm:
        Container runtime:
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Link related plans, contracts, logs, screenshots, or prior investigations.
    validations:
      required: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Template</title>
  <desc id="desc">A governed monorepo template for coding agents and enterprise agent applications, using progressive disclosure and evidence-backed checks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1b31"/>
      <stop offset="1" stop-color="#102743"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d5ff"/>
      <stop offset="0.52" stop-color="#72e2cf"/>
      <stop offset="1" stop-color="#a4f7a6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.035"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39d5ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#39d5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a4f7a6" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#a4f7a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d9f4ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <rect width="1280" height="640" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="74" r="250" fill="url(#glowA)"/>
  <circle cx="180" cy="600" r="290" fill="url(#glowB)"/>
  <path d="M0 526 C260 438 376 612 664 512 S1018 356 1280 426 V640 H0Z" fill="#06101d" fill-opacity="0.50"/>
  <path d="M0 573 C248 470 414 676 730 548 S1070 465 1280 505" fill="none" stroke="url(#accent)" stroke-opacity="0.16" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(72 66)">
      <rect width="373" height="34" rx="17" fill="#39d5ff" fill-opacity="0.10" stroke="#72e2cf" stroke-opacity="0.35"/>
      <circle cx="19" cy="17" r="4" fill="#8bf0ba"/>
      <text x="33" y="22" fill="#bfefff" font-size="13" font-weight="700" letter-spacing="1.8">PROGRESSIVE-DISCLOSURE ENGINEERING</text>
    </g>

    <text x="72" y="205" fill="#f5fbff" font-size="62" font-weight="780" letter-spacing="-2.8">AI Coding</text>
    <text x="72" y="272" fill="url(#accent)" font-size="62" font-weight="780" letter-spacing="-2.8">Template</text>
    <text x="74" y="326" fill="#c6d8e8" font-size="22" font-weight="460">Build governed agent systems with clear context,</text>
    <text x="74" y="359" fill="#c6d8e8" font-size="22" font-weight="460">reusable skills, and evidence-backed checks.</text>

    <g transform="translate(74 408)">
      <rect width="154" height="38" rx="19" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="20" cy="19" r="5" fill="#39d5ff"/>
      <text x="34" y="24" fill="#deedf8" font-size="15" font-weight="650">Governed skills</text>
    </g>
    <g transform="translate(240 408)">
      <rect width="182" height="38" rx="19" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="20" cy="19" r="5" fill="#72e2cf"/>
      <text x="34" y="24" fill="#deedf8" font-size="15" font-weight="650">Python + TypeScript</text>
    </g>
    <g transform="translate(434 408)">
      <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="20" cy="19" r="5" fill="#a4f7a6"/>
      <text x="34" y="24" fill="#deedf8" font-size="15" font-weight="650">Human approval</text>
    </g>
    <g transform="translate(614 408)">
      <rect width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.065" stroke="#ffffff" stroke-opacity="0.13"/>
      <circle cx="20" cy="19" r="5" fill="#f5d36a"/>
      <text x="34" y="24" fill="#deedf8" font-size="15" font-weight="650">CI verified</text>
    </g>

    <text x="74" y="546" fill="#8fa6b9" font-size="15" font-weight="580" letter-spacing="0.5">OPEN THE RIGHT CONTEXT · CHANGE WITH BOUNDARIES · PROVE THE RESULT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="774" y="72" width="430" height="496" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.15"/>
  </g>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="818" y="124" fill="#7f9aaf" font-size="13" font-weight="750" letter-spacing="2.1">CONTEXT ROUTER</text>
    <text x="818" y="157" fill="#f5fbff" font-size="25" font-weight="720">Less context. More signal.</text>

    <line x1="840" y1="218" x2="840" y2="443" stroke="#72e2cf" stroke-opacity="0.36" stroke-width="2"/>

    <g transform="translate(818 198)">
      <circle cx="22" cy="22" r="22" fill="#39d5ff" fill-opacity="0.14" stroke="#39d5ff" stroke-opacity="0.45"/>
      <text x="22" y="28" text-anchor="middle" fill="#a9ebff" font-size="16" font-weight="760">1</text>
      <text x="62" y="18" fill="#f4fbff" font-size="17" font-weight="700">Start at AGENTS.md</text>
      <text x="62" y="42" fill="#9fb5c7" font-size="14">Standing rules + task index</text>
    </g>
    <g transform="translate(818 284)">
      <circle cx="22" cy="22" r="22" fill="#72e2cf" fill-opacity="0.14" stroke="#72e2cf" stroke-opacity="0.45"/>
      <text x="22" y="28" text-anchor="middle" fill="#bff8ed" font-size="16" font-weight="760">2</text>
      <text x="62" y="18" fill="#f4fbff" font-size="17" font-weight="700">Open one task route</text>
      <text x="62" y="42" fill="#9fb5c7" font-size="14">Local rules, owners, contracts</text>
    </g>
    <g transform="translate(818 370)">
      <circle cx="22" cy="22" r="22" fill="#a4f7a6" fill-opacity="0.13" stroke="#a4f7a6" stroke-opacity="0.42"/>
      <text x="22" y="28" text-anchor="middle" fill="#d5ffd5" font-size="16" font-weight="760">3</text>
      <text x="62" y="18" fill="#f4fbff" font-size="17" font-weight="700">Change inside a boundary</text>
      <text x="62" y="42" fill="#9fb5c7" font-size="14">Source, tests, policy, evidence</text>
    </g>
    <g transform="translate(818 456)">
      <circle cx="22" cy="22" r="22" fill="#f5d36a" fill-opacity="0.13" stroke="#f5d36a" stroke-opacity="0.42"/>
      <text x="22" y="28" text-anchor="middle" fill="#fff0b0" font-size="16" font-weight="760">4</text>
      <text x="62" y="18" fill="#f4fbff" font-size="17" font-weight="700">Report observed output</text>
      <text x="62" y="42" fill="#9fb5c7" font-size="14">Checks, reviewers, human gates</text>
    </g>

    <rect x="818" y="518" width="342" height="1" fill="#ffffff" fill-opacity="0.10"/>
    <text x="818" y="544" fill="#7f9aaf" font-size="13" font-weight="650">One repository · Two systems · Explicit responsibilities</text>
  </g>
</svg>
